[package]
name = "omacontrol-core"
description = "TV discovery, protocols (Samsung Tizen, LG webOS, Roku ECP, Android TV) and Omarchy themes for OmaControl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"
rsa = "0.9"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "__rustls-tls"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
x509-parser = "0.16"
