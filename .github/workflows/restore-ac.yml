name: restore-ac
on:
  push:
    branches: [add-haier-and-daikin-ac-protocols]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-haier-and-daikin-ac-protocols
          fetch-depth: 0
      - name: restore
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout origin/main -- crates/omacontrol-core/src/ac.rs
          git add crates/omacontrol-core/src/ac.rs
          git commit -m "restore ac.rs from main" || echo "no changes"
          git push
