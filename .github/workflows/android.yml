name: Android, Linux and iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml ($crate). Bump [workspace.package] version, commit, then tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml ($crate)."
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] || [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "::error::Set both ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Tagged releases require the permanent Android signing key. Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          else
            # Untagged builds without the permanent key use a throwaway key.
            keytool -genkeypair -v -keystore release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=OmaControl"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$PWD/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo apk build --release --lib -p omacontrol
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/apk/omacontrol.apk dist/omacontrol-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: omacontrol-apk
          path: dist/*.apk
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}

  linux:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Slint desktop backend)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Build Linux desktop app
        run: cargo build --locked --release -p omacontrol
      - name: Package
        run: |
          mkdir -p dist/linux
          install -m755 target/release/omacontrol dist/linux/omacontrol
          install -m644 packaging/io.github.abraham_ukachi.omacontrol.desktop dist/linux/io.github.abraham_ukachi.omacontrol.desktop
          install -m644 .github/omacontrol-icon.png dist/linux/omacontrol.png
          tar -C dist/linux -czf dist/omacontrol-linux-x86_64.tar.gz \
            omacontrol \
            io.github.abraham_ukachi.omacontrol.desktop \
            omacontrol.png
      - uses: actions/upload-artifact@v7
        with:
          name: omacontrol-linux-x86_64
          path: dist/omacontrol-linux-x86_64.tar.gz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/omacontrol-linux-x86_64.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}

  ios:
    needs: apk
    runs-on: macos-latest
    env:
      OMACONTROL_CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: ios/generate.sh
      - name: Build for iPhone (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project OmaControl.xcodeproj -target OmaControl -configuration Release \
            -sdk iphoneos ARCHS=arm64 SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the unsigned .ipa
        run: |
          app=ios/build/Release-iphoneos/OmaControl.app
          test -x "$app/OmaControl"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' "$app/Info.plist"
          mkdir -p dist ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../dist/omacontrol-${GITHUB_REF_NAME//\//-}-unsigned.ipa Payload)
      - name: Sign the .ipa (only when the signing secrets are set)
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_PROVISION_PROFILE_BASE64" ]; then
            echo "No iOS signing secrets: shipping the unsigned .ipa only."
            exit 0
          fi
          ios/sign.sh ios/build/Release-iphoneos/OmaControl.app dist/omacontrol-${GITHUB_REF_NAME//\//-}.ipa
      - name: Build for the simulator (check)
        working-directory: ios
        run: |
          xcodebuild -project OmaControl.xcodeproj -target OmaControl -configuration Debug \
            -sdk iphonesimulator ARCHS=arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: omacontrol-ios
          path: dist/*.ipa
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.ipa
          prerelease: ${{ contains(github.ref_name, '-') }}
