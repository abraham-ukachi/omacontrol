[package]
name = "omacontrol"
description = "A dead-simple remote for any smart TV, with Omarchy's look & feel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "omacontrol"
path = "src/main.rs"

[dependencies]
log = "0.4"
omacontrol-core = { path = "../crates/omacontrol-core" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = "1"

# iOS: Slint runs on winit + Skia there (see ios/ and Slint's iOS guide). objc2 reaches UIKit
# for the haptic tick, opening links and the phone's language.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSArray", "NSLocale"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1"
# Compiles app/android/java (the speech recognizer bridge) for Android builds.
android-build = "0.1"

# `cargo apk build --release --lib -p omacontrol` (see .github/workflows/android.yml)
[package.metadata.android]
package = "io.github.abraham_ukachi.omacontrol"
apk_name = "omacontrol"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.TRANSMIT_IR"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

# Android 11+ only lets SpeechRecognizer find the phone's recognizer when the app says it looks
# for one (the voice fallback for TVs that won't take the phone's microphone).
[[package.metadata.android.queries.intent]]
actions = ["android.speech.RecognitionService"]

[[package.metadata.android.uses_feature]]
name = "android.hardware.consumerir"
required = false

[package.metadata.android.application]
label = "OmaControl"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "portrait"
