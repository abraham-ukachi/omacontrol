[workspace]
resolver = "2"
members = ["crates/omacontrol-core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Abraham Ukachi <abraham.ukachi@laplateforme.io>"]
license = "MIT"
repository = "https://github.com/abraham-ukachi/omacontrol"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
